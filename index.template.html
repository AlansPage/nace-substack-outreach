<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Substack outreach — local workspace</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#f4f7f5;color:#1d3029;
  font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
.ss-boot{padding:38px 0;color:#62716a;font-size:13px}
/*__SUBSTACK_CSS__*/
</style>
</head>
<body>
<main class="wrap">
  <div id="tab-substack"><p class="ss-boot">Loading the local workspace…</p></div>
  <noscript><p class="ss-boot">This workspace needs JavaScript. Nothing is sent anywhere; it only
  talks to the worker running on your own machine.</p></noscript>
</main>
<script>
/*__SUBSTACK_UI__*/
</script>
<script>
// The UI boots on the host page's tab event. This shell has a single view, so announce it once.
document.addEventListener('DOMContentLoaded', function () {
  window.dispatchEvent(new CustomEvent('smap:tab', { detail: 'substack' }));
});
</script>
</body>
</html>
